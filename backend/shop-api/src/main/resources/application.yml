server:
  port: 8080

spring:
  application:
    name: shop-api

  # 数据源配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/shop?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
    username: root
    # password:

  # Liquibase配置（api模块独立执行，与admin模块共用一套Liquibase表）
  liquibase:
    enabled: true
    change-log: classpath:db/db.changelog-master.yaml
    contexts: api
    # 启动时清除Liquibase校验和（生产环境建议移除）
    clear-checksums: true

  # Jackson配置
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    default-property-inclusion: non_null

  data:
    # Redis配置
    redis:
      host: localhost
      # password:
      port: 6379
      database: 0
      timeout: 5000ms

# MyBatis Plus配置
mybatis-plus:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.shop.entity
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# 应用自定义配置
app:
  # API模块配置
  api:
    # JWT配置
    jwt:
      # JWT密钥（生产环境必须修改为强密钥，≥32字符）
      secret: shop-secret-key-for-jwt-token-generation
      # JWT过期时间（毫秒），604800000ms = 7天
      expiration: 604800000
  # 日志配置
  log:
    kafka:
      bootstrap-servers: localhost:9094
    level:
      app: DEBUG
      mybatis-plus: DEBUG

