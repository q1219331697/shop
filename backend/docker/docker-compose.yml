# ============================================================
# Docker Compose - 完整编排
# 通过 include 引入基础设施和应用服务，避免重复代码
# 变量说明: 在 .env 文件中配置，APP_NAME 控制容器名前缀
#
# 分层启动:
#   仅基础设施:  docker compose -f docker-compose.infra.yml up -d
#   仅应用服务:  docker compose -f docker-compose.app.yml up -d
#   全部启动:    docker compose up -d
# ============================================================

include:
  - docker-compose.infra.yml
  - docker-compose.app.yml
