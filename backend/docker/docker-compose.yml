# ============================================================
# Docker Compose 配置文件
# 变量说明: 在 .env 文件中配置，APP_NAME 控制容器名前缀，避免多项目冲突
# ============================================================

services:
  # ==================== MySQL 数据库 ====================
  mysql:
    image: mysql:9.7
    container_name: ${APP_NAME}-mysql
    ports:
      - "3306:3306"
    environment:
      # root 密码为空
      MYSQL_ROOT_PASSWORD: ""
      # 允许空密码登录
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      # 自动创建的数据库
      MYSQL_DATABASE: shop
      # 时区设置
      TZ: Asia/Shanghai
    # UTF8MB4 字符集（支持 emoji 等 4 字节字符）
    # 排序规则备忘: utf8mb4_0900_ai_ci
    #   utf8mb4 - 每字符最多4字节, 完整支持Unicode含Emoji
    #   0900    - 基于Unicode 9.0 (general_ci基于3.x, unicode_ci基于4.0)
    #   ai      - Accent Insensitive, 不区分重音 (é=e, ü=u)
    #   ci      - Case Insensitive, 不区分大小写 (A=a)
    #   其他变体: _as_ci(区分重音) / _ai_cs(区分大小写) /
    #            _as_cs(都区分) / _bin(二进制精确匹配)
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_0900_ai_ci
    volumes:
      # 数据持久化
      - ./volumes/mysql/data:/var/lib/mysql
      # 自定义配置
      - ./volumes/mysql/conf:/etc/mysql/conf.d
      # 初始化 SQL 脚本（仅首次启动执行）
      - ./volumes/mysql/init:/docker-entrypoint-initdb.d
    networks:
      - shop_network

  # ==================== Redis 缓存 ====================
  redis:
    image: redis:8-alpine
    container_name: ${APP_NAME}-redis
    ports:
      - "6379:6379"
    # 开启 AOF 持久化
    command: redis-server --appendonly yes
    # 备忘: Redis 持久化方式
    #   - RDB: 定时快照，文件小恢复快，但可能丢失最后一次快照后的数据
    #   - AOF: 追加写命令日志，最多丢1秒数据（当前启用）
    #   - 混合持久化(RDB+AOF): 4.0+ 支持，aof-use-rdb-preamble yes，兼顾体积与安全，生产推荐
    volumes:
      - ./volumes/redis/data:/data
    networks:
      - shop_network

  # ==================== RabbitMQ 消息队列 ====================
  rabbitmq:
    image: rabbitmq:3-management
    container_name: ${APP_NAME}-rabbitmq
    ports:
      # AMQP 协议端口
      - "5672:5672"
      # 管理后台端口（http://localhost:15672）
      - "15672:15672"
    environment:
      # 默认用户名
      RABBITMQ_DEFAULT_USER: shop
      # 默认密码
      RABBITMQ_DEFAULT_PASS: shop123
    volumes:
      - ./volumes/rabbitmq/data:/var/lib/rabbitmq
      - ./volumes/rabbitmq/log:/var/log/rabbitmq
    networks:
      - shop_network

  # ==================== Kafka 消息队列 ====================
  kafka:
    image: apache/kafka:latest
    # 容器名前缀，由 .env 中 APP_NAME 控制
    container_name: ${APP_NAME}-kafka
    ports:
      # 内部通信端口（容器间）
      - "9092:9092"
      # 外部访问端口（宿主机连接）
      - "9094:9094"
    environment:
      # 节点 ID，单节点设为 1
      KAFKA_NODE_ID: 1
      # 节点角色：同时充当 broker 和 controller
      KAFKA_PROCESS_ROLES: broker,controller

      # 监听器：内部(9092)、控制器(9093)、外部(9094)
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      # 广播地址：内部用服务名，外部用 localhost
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9094
      # 各监听器使用的安全协议
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      # 集群内部通信使用的监听器名称
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      # 控制器使用的监听器名称
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # 控制器投票成员，格式: node_id@host:port
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      # 单节点副本数设为1（必须，默认3会报错）
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      # 事务日志副本数设为1（必须，默认3会报错）
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      # 事务日志最小同步副本数设为1（必须，默认2会报错）
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      # 消费者组首次 Rebalance 等待时间（可选，开发环境设0加快启动）
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # 自动创建 topic 时的默认分区数（可选，不设则默认1；分区数=同一消费者组最大并发数）
      KAFKA_NUM_PARTITIONS: 3
      # 集群唯一 ID（KRaft 模式必需，用 base64 生成）
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - ./volumes/kafka/data:/var/lib/kafka/data
      - ./volumes/kafka/secrets:/etc/kafka/secrets
      - ./volumes/kafka/config:/mnt/shared/config
    networks:
      - shop_network

  # ==================== Elasticsearch 搜索引擎 ====================
  elasticsearch:
    image: elasticsearch:9.3.3
    container_name: ${APP_NAME}-elasticsearch
    environment:
      # 单节点模式
      - discovery.type=single-node
      # JVM 堆内存限制
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      # 关闭安全认证（开发环境）
      - xpack.security.enabled=false
      # 时区设置
      - TZ=Asia/Shanghai
    ports:
      # REST API 端口
      - "9200:9200"
      # 节点间通信端口
      - "9300:9300"
    volumes:
      - ./volumes/elasticsearch/data:/usr/share/elasticsearch/data
    networks:
      - shop_network

  # ==================== Logstash 日志收集 ====================
  logstash:
    image: logstash:9.3.3
    container_name: ${APP_NAME}-logstash
    environment:
      # 时区设置
      - TZ=Asia/Shanghai
    ports:
      # Beats 输入端口
      - "5044:5044"
      # Logstash API 端口
      - "9600:9600"
    volumes:
      # 管道配置目录
      - ./config/logstash:/usr/share/logstash/pipeline
      - ./volumes/logstash/data:/usr/share/logstash/data
    depends_on:
      - elasticsearch
    networks:
      - shop_network

  # ==================== Kibana 可视化面板 ====================
  kibana:
    image: kibana:9.3.3
    container_name: ${APP_NAME}-kibana
    ports:
      # Kibana Web 端口
      - "5601:5601"
    environment:
      # 连接 ES（使用服务名）
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      # 中文界面
      - I18N_LOCALE=zh-CN
      # 时区设置
      - TZ=Asia/Shanghai
    depends_on:
      - elasticsearch
    networks:
      - shop_network

# ==================== 网络配置 ====================
networks:
  shop_network:
    # 所有服务在同一网络，可通过服务名互相访问
    name: ${APP_NAME}_network
    driver: bridge
