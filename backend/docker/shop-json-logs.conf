
# Logstash Pipeline 配置文件
# 用于处理 JSON 格式的日志

input {
  # 从 Kafka 接收 JSON 日志
  kafka {
    bootstrap_servers => "kafka:9092"
    # 指定要消费的 Kafka 主题列表（注意：topics_pattern 会覆盖此配置，此处仅作备忘）
    # topics => ["app-logs"]
    # 使用正则表达式匹配所有以 -json-logs 结尾的主题（此配置优先级高于 topics）
    topics_pattern => ".*-json-logs"
    # 消费者组ID
    group_id => "logstash-app-json-logs-consumer"
    # 从最新消息开始消费
    auto_offset_reset => "latest"
    # 解码器：直接解析 JSON 格式消息
    codec => json {
      charset => "UTF-8"
    }
  }
}

filter {
  # 解析 JSON 格式日志
  json {
    source => "message"
    # 解析失败时添加标签，便于排查
    tag_on_failure => ["_jsonparsefailure"]
  }

  # 如果 JSON 中包含 timestamp 字段，解析为 @timestamp
  if [timestamp] {
    date {
      match => ["timestamp", "ISO8601"]
      target => "@timestamp"
      timezone => "Asia/Shanghai"
    }
    mutate {
      remove_field => ["timestamp"]
    }
  }

  # 如果 JSON 中没有 app_name 字段，尝试从 application 字段取值
  if ![app_name] and [application] {
    mutate {
      add_field => { "app_name" => "%{application}" }
    }
  }

  # 添加环境信息
  mutate {
    add_field => {
      "application" => "%{app_name}"
      "environment" => "${ENVIRONMENT:dev}"
    }
  }
}

output {
  # 输出到标准输出（用于调试）
  stdout {
    codec => rubydebug
  }

  # 输出到 Elasticsearch
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    # 索引名称模式：app_name-json-logs-YYYY.MM.dd
    index => "%{app_name}-json-logs-%{+YYYY.MM.dd}"
  }
}
