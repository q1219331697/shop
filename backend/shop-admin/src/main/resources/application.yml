server:
  port: 8081

spring:
  application:
    name: shop-admin

  # 数据源配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/shop?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
    username: root
    # password:

  # Liquibase配置（admin模块独立执行，与api模块共用一套Liquibase表）
  liquibase:
    enabled: true
    change-log: classpath:db/db.changelog-master.yaml
    contexts: admin
    # 启动时清除Liquibase校验和（生产环境建议移除）
    clear-checksums: true

  # Jackson配置
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    # JSON 序列化时忽略 null 值字段
    default-property-inclusion: non_null

  data:
    # Redis配置
    redis:
      host: localhost
      # password:
      port: 6379
      database: 0
      timeout: 5000ms

# MyBatis Plus配置
mybatis-plus:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.shop.entity
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# JWT配置
jwt:
  secret: shop-secret-key-for-jwt-token-generation
  expiration: 604800000

# 管理员配置
admin:
  token:
    # Token过期时间（Spring Boot Duration格式）
    # 支持写法: 30s(秒), 30m(分钟), 2h(小时), 1d(天), PT2H30M(2小时30分钟)
    expire: 2h
  auth:
    # 前缀匹配的放行路径（无需认证即可访问）
    permit-prefix-paths:
      - /public/
      - /favicon.ico
      - /doc.html
      - /webjars/
      - /v3/api-docs
      - /swagger-resources
      - /swagger-ui
      - /api-docs

knife4j:
  enable: true
  # 开启Basic认证（访问Swagger文档时需要输入用户名密码）
  basic:
    enable: true
    username: admin
    password: admin123
  setting:
    # 开启Swagger UI的Authorize功能
    enable-open-authorize: true
    language: zh_cn

