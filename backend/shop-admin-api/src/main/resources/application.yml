server:
  port: 8080

spring:
  application:
    name: shop-admin

  # 数据源配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://mysql:3306/shop?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
    username: ${MYSQL_USERNAME:-root}
    password: ${MYSQL_PASSWORD:-root123}

  # Liquibase配置
  liquibase:
    enabled: true
    change-log: classpath:db/db.changelog-master.yaml
    # 启动时清除Liquibase校验和（生产环境建议移除）
    clear-checksums: true
    # 禁用 duplicate-file-mode（Spring Boot 3.x 不支持此属性）

  # Jackson配置
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    # JSON 序列化时忽略 null 值字段
    default-property-inclusion: non_null

  data:
    # Redis配置
    redis:
      host: ${SPRING_DATA_REDIS_HOST:-redis}
      password: ${REDIS_PASSWORD:-}
      port: ${SPRING_DATA_REDIS_PORT:-6379}
      database: 0
      timeout: 5000ms

# MyBatis Plus配置
mybatis-plus:
  mapper-locations: classpath*:mapper/**/*Mapper.xml
  type-aliases-package: com.shop.**.entity
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# 应用自定义配置
app:
  # 管理员配置
  admin:
    token:
      # Token过期时间（Spring Boot Duration格式）
      # 支持写法: 30s(秒), 30m(分钟), 2h(小时), 1d(天), PT2H30M(2小时30分钟)
      expire: 2h
    auth:
      # 前缀匹配的放行路径（无需认证即可访问）
      permit-prefix-paths:
        - /public/
        - /favicon.ico
        - /doc.html
        - /webjars/
        - /v3/api-docs
        - /swagger-resources
        - /swagger-ui
        - /api-docs
        - /actuator

  # 日志配置
  log:
    kafka:
      enabled: false
      bootstrap-servers: kafka:9092
    level:
      app: DEBUG
      mybatis-plus: DEBUG

# Actuator监控端点配置
management:
  endpoints:
    web:
      # 端点基础路径（默认为/actuator）
      base-path: /actuator
      exposure:
        # 暴露所有端点（生产环境注意安全，建议按需开放）
        include: "*"
  endpoint:
    startup:
      # 启用startup端点（记录Bean初始化耗时，需配合AOP使用）
      access: read_only
    health:
      # 显示详细健康信息（always/when-authorized/never）
      show-details: always
      # 显示各组件的详细状态
      show-components: always

knife4j:
  enable: true
