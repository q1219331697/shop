databaseChangeLog:
  - changeSet:
      id: 1
      author: shop
      changes:
        - createTable:
            tableName: user
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
              - column:
                  name: username
                  type: varchar(50)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: password
                  type: varchar(100)
                  constraints:
                    nullable: false
              - column:
                  name: email
                  type: varchar(100)
                  constraints:
                    nullable: true
                    unique: true
              - column:
                  name: phone
                  type: varchar(20)
                  constraints:
                    nullable: true
                    unique: true
              - column:
                  name: nickname
                  type: varchar(50)
                  constraints:
                    nullable: true
              - column:
                  name: avatar
                  type: varchar(255)
                  constraints:
                    nullable: true
              - column:
                  name: status
                  type: int
                  defaultValue: 1
                  constraints:
                    nullable: false
              - column:
                  name: create_time
                  type: datetime
                  constraints:
                    nullable: false
              - column:
                  name: update_time
                  type: datetime
                  constraints:
                    nullable: false
