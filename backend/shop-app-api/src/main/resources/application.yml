server:
  port: 8080

spring:
  application:
    name: shop-api

  # 数据源配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://mysql:3306/shop?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
    username: ${MYSQL_USERNAME:-root}
    password: ${MYSQL_PASSWORD:-root123}

  # Jackson配置
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    default-property-inclusion: non_null

  data:
    # Redis配置
    redis:
      host: ${SPRING_DATA_REDIS_HOST:-redis}
      password: ${REDIS_PASSWORD:-}
      port: ${SPRING_DATA_REDIS_PORT:-6379}
      database: 0
      timeout: 5000ms

# MyBatis Plus配置
mybatis-plus:
  mapper-locations: classpath*:mapper/**/*Mapper.xml
  type-aliases-package: com.shop.**.entity
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# 应用自定义配置
app:
  # 日志配置
  log:
    kafka:
      bootstrap-servers: kafka:9092
    level:
      app: DEBUG
      mybatis-plus: DEBUG

# Actuator监控端点配置
management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: "*"
  endpoint:
    startup:
      access: read_only
    health:
      show-details: always
      show-components: always

knife4j:
  enable: true
