# ============================================================
# Docker Compose - 应用服务
# 仅包含 shop-admin 和 shop-api 应用
# 依赖: 需要先启动基础设施（docker compose --env-file .env.<环境> -f docker-compose.infra.yml up -d）
# 变量说明: 在 .env.<环境> 文件中配置，APP_NAME 控制容器名前缀和网络隔离
# 多环境部署:
#   测试: docker compose --env-file .env.test -f docker-compose.app.yml up -d
#   生产: docker compose --env-file .env.prod -f docker-compose.app.yml up -d
# ============================================================

services:
  # ==================== shop-admin 后台管理服务 ====================
  shop-admin:
    image: shop-admin:${APP_VERSION:-1.0.0}
    container_name: ${APP_NAME}-admin
    ports:
      - "${ADMIN_PORT:-8081}:8081"
    environment:
      # JVM 参数
      JAVA_OPTS: "${ADMIN_JAVA_OPTS:--Xms256m -Xmx512m -XX:+UseG1GC}"
      # 数据源配置（使用服务名连接容器内 MySQL）
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/shop?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true"
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USERNAME:-root}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-}
      # Redis 配置
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      # 日志Kafka配置（容器内使用内部端口 9092）
      APP_LOG_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      # 时区
      TZ: Asia/Shanghai
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - shop_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ==================== shop-api 前台API服务 ====================
  shop-api:
    image: shop-api:${APP_VERSION:-1.0.0}
    container_name: ${APP_NAME}-api
    ports:
      - "${API_PORT:-8080}:8080"
    environment:
      # JVM 参数
      JAVA_OPTS: "${API_JAVA_OPTS:--Xms256m -Xmx512m -XX:+UseG1GC}"
      # 数据源配置
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/shop?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true"
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USERNAME:-root}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-}
      # Redis 配置
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      # 日志Kafka配置
      APP_LOG_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      # 时区
      TZ: Asia/Shanghai
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - shop_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ==================== shop-admin-ui 后台管理前端 ====================
  shop-admin-ui:
    image: shop-admin-ui:${APP_VERSION:-1.0.0}
    container_name: ${APP_NAME}-admin-ui
    ports:
      - "${ADMIN_UI_PORT:-5173}:80"
    depends_on:
      shop-admin:
        condition: service_healthy
    networks:
      - shop_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

# ==================== 网络配置 ====================
networks:
  shop_network:
    # 引用基础设施创建的网络，确保应用和中间件在同一网络
    # 通过 APP_NAME 隔离不同环境的网络
    external: true
    name: ${APP_NAME}_network
