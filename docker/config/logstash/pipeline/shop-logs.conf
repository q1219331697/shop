# Logstash Pipeline 配置文件
# 用于处理纯文本格式的日志

input {
  # 从 Kafka 接收纯文本日志
  kafka {
    bootstrap_servers => "kafka:9092"
    # 指定要消费的 Kafka 主题列表
    topics => ["shop-logs"]
    # 使用正则表达式匹配所有以 -logs 结尾的主题（此配置优先级高于 topics，如需启用请取消注释）
    # topics_pattern => ".*-logs"
    # 消费者组ID
    group_id => "logstash-app-logs-consumer"
    # 从最新消息开始消费
    auto_offset_reset => "latest"
    # 解码器
    codec => plain {
      charset => "UTF-8"
    }
  }
}

filter {
  # 解析日志格式：[时间戳] [应用名] [线程] [级别] [类名.方法(行号)] - [日志正文]
  # 示例：[2026-05-11T19:53:23.608+08:00] [shop] [main] [INFO] [com.shop.Application.main(30)] - [Started]
  grok {
    match => {
      "message" => "\[%{TIMESTAMP_ISO8601:timestamp}\] \[%{DATA:app_name}\] \[%{DATA:thread}\] \[%{LOGLEVEL:level}\] \[%{JAVACLASS:class}\.%{JAVAMETHOD:method}\(%{INT:line}\)\] - \[%{GREEDYDATA:log_message}\]"
    }
    # 允许覆盖 message 字段（配合 mutate replace 使用）
    overwrite => ["message"]
  }

  # 用 log_message 的值覆盖 message，只保留日志正文
  mutate {
    replace => {"message" => "%{log_message}"}
  }

  # 解析时间戳，将日志中的时间写入 @timestamp
  # 注意：Kibana @timestamp 显示格式设置备忘：
  #   Management → Stack Management → Advanced Settings
  #     dateFormat       => YYYY-MM-DDTHH:mm:ss.SSS
  #     dateFormat:tz 为 Asia/Shanghai
  date {
    match => ["timestamp", "ISO8601"]
    target => "@timestamp"
    # timezone 指定原始时间戳的时区（东八区），Logstash 内部统一转为 UTC 存储
    timezone => "Asia/Shanghai"
  }

  # 从 timestamp 字段直接截取日期部分作为 [@metadata][index_date]（东八区日期）
  # @metadata 字段不会写入 Elasticsearch，避免存储浪费
  # timestamp 格式为 2026-05-13T01:24:07,229，截取前10位即 2026-05-13
  # 再将 - 替换为 . 得到 2026.05.13，用于索引名
  mutate {
    add_field => { "[@metadata][index_date]" => "%{timestamp}" }
  }
  ruby {
    code => "
      ts = event.get('[@metadata][index_date]')
      if ts && ts.length >= 10
        event.set('[@metadata][index_date]', ts[0, 10].gsub('-', '.'))
      end
    "
  }

  # 去掉已解析完毕的中间字段，避免冗余
  #   timestamp   已解析到 @timestamp，[@metadata][index_date] 已从 timestamp 生成
  #   log_message 已覆盖回 message
  mutate {
    remove_field => ["timestamp", "log_message"]
  }

  # 确保索引名小写（Elasticsearch 要求索引名必须全小写）
  mutate {
    lowercase => ["app_name"]
  }

  # 添加环境信息
  mutate {
    add_field => {
      "application" => "%{app_name}"
      "environment" => "${ENVIRONMENT:dev}"
    }
  }
}

output {
  # 输出到标准输出（用于调试）
  stdout {
    codec => rubydebug
  }

  # 输出到 Elasticsearch
  # 1、
  # 自定义index，普通index，可CRUD，注意名字app_name-logs-YYYY.MM.dd
  # elasticsearch {
  #   hosts => ["elasticsearch:9200"]
  #   # 索引名称模式：app_name-logs-YYYY.MM.dd
  #   # 使用 [@metadata][index_date]（东八区日期）而非 %{+YYYY.MM.dd}（UTC 日期），
  #   # 解决索引名少8小时的问题
  #   index => "%{app_name}-logs-%{[@metadata][index_date]}"
  # }
  # 
  # 2、
  # 默认数据流（Data Stream）模式，只读模式，Elasticsearch 8.x 推荐使用数据流模式
  # data_stream 
  #   名字: logs-app-java-default，
  #   index: .ds-logs-app-java-default-yyyy.MM.dd-000001
  elasticsearch {
    hosts => ["elasticsearch:9200"]

    # 核心：必须显式声明这是数据流写入！
    data_stream => "true"
    data_stream_type => "logs"
    data_stream_dataset => "app-java"
    data_stream_namespace => "default"
  }
}
