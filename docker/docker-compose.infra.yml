# ============================================================
# Docker Compose - 基础设施服务
# 仅包含 MySQL、Redis、Kafka、RabbitMQ、ELK 等中间件
# 用途: 开发环境启动基础设施，应用在本地 IDE 运行
# 变量说明: 在 .env.<环境> 文件中配置，APP_NAME 控制容器名前缀和网络隔离
# 多环境部署:
#   测试: docker compose --env-file .env.test -f docker-compose.infra.yml up -d
#   生产: docker compose --env-file .env.prod -f docker-compose.infra.yml up -d
# ============================================================

services:
  # ==================== MySQL 数据库 ====================
  mysql:
    image: mysql:9.7
    container_name: ${APP_NAME}-mysql
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_PASSWORD:-}"
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: shop
      TZ: Asia/Shanghai
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_0900_ai_ci
    volumes:
      - ./volumes/${APP_NAME}/mysql/data:/var/lib/mysql
      - ./volumes/${APP_NAME}/mysql/conf:/etc/mysql/conf.d
      - ./volumes/${APP_NAME}/mysql/init:/docker-entrypoint-initdb.d
    networks:
      - shop_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ==================== Redis 缓存 ====================
  redis:
    image: redis:8-alpine
    container_name: ${APP_NAME}-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: redis-server --appendonly yes ${REDIS_PASSWORD:+--requirepass ${REDIS_PASSWORD}}
    volumes:
      - ./volumes/${APP_NAME}/redis/data:/data
    networks:
      - shop_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==================== RabbitMQ 消息队列 ====================
  rabbitmq:
    image: rabbitmq:3-management
    container_name: ${APP_NAME}-rabbitmq
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MGMT_PORT:-15672}:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-shop}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-shop123}
    volumes:
      - ./volumes/${APP_NAME}/rabbitmq/data:/var/lib/rabbitmq
      - ./volumes/${APP_NAME}/rabbitmq/log:/var/log/rabbitmq
    networks:
      - shop_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ==================== Kafka 消息队列 ====================
  kafka:
    image: apache/kafka:latest
    container_name: ${APP_NAME}-kafka
    ports:
      - "${KAFKA_PORT:-9092}:9092"
      - "${KAFKA_EXTERNAL_PORT:-9094}:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:${KAFKA_EXTERNAL_PORT:-9094}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - ./volumes/${APP_NAME}/kafka/data:/var/lib/kafka/data
      - ./volumes/${APP_NAME}/kafka/secrets:/etc/kafka/secrets
      - ./volumes/${APP_NAME}/kafka/config:/mnt/shared/config
    networks:
      - shop_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ==================== Elasticsearch 搜索引擎 ====================
  elasticsearch:
    image: elasticsearch:9.3.3
    container_name: ${APP_NAME}-elasticsearch
    environment:
      - discovery.type=single-node
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - xpack.security.enabled=false
      - TZ=Asia/Shanghai
    ports:
      - "${ES_PORT:-9200}:9200"
      - "9300:9300"
    volumes:
      - ./volumes/${APP_NAME}/elasticsearch/data:/usr/share/elasticsearch/data
    networks:
      - shop_network
    restart: unless-stopped
    mem_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 40s

  # ==================== Logstash 日志收集 ====================
  logstash:
    image: logstash:9.3.3
    container_name: ${APP_NAME}-logstash
    environment:
      - TZ=Asia/Shanghai
    ports:
      - "${LOGSTASH_PORT:-5044}:5044"
      - "9600:9600"
    volumes:
      - ./config/logstash:/usr/share/logstash/pipeline
      - ./volumes/${APP_NAME}/logstash/data:/usr/share/logstash/data
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - shop_network
    restart: unless-stopped

  # ==================== Kibana 可视化面板 ====================
  kibana:
    image: kibana:9.3.3
    container_name: ${APP_NAME}-kibana
    ports:
      - "${KIBANA_PORT:-5601}:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - I18N_LOCALE=zh-CN
      - TZ=Asia/Shanghai
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - shop_network
    restart: unless-stopped

# ==================== 网络配置 ====================
networks:
  shop_network:
    name: ${APP_NAME}_network
    driver: bridge
