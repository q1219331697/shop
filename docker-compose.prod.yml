# ============================================================
# Docker Compose - Shop 应用（生产环境）
# 包含：基础设施 + 应用服务
#
# 使用方法：
#   docker compose -p shop-prod -f docker-compose.prod.yml up -d
#
# ⚠️ 安全警告：生产环境必须修改敏感配置
# ============================================================

services:
  # ==================== MySQL 数据库 ====================
  mysql:
    image: mysql:9
    container_name: shop-prod-mysql
    ports:
      - '23306:3306'
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
      MYSQL_DATABASE: shop
      TZ: Asia/Shanghai
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_0900_ai_ci
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - shop_default
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1g

  # ==================== Redis 缓存 ====================
  redis:
    image: redis:8-alpine
    container_name: shop-prod-redis
    ports:
      - '26379:6379'
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - shop_default
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512m

  # ==================== Kafka 消息队列 ====================
  kafka:
    image: apache/kafka:latest
    container_name: shop-prod-kafka
    ports:
      - '29094:9094'
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'controller,broker'
      KAFKA_LISTENERS: 'PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:9094'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29094'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:9093'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    volumes:
      - kafka_data:/var/lib/kafka/data
      - kafka_secrets:/etc/kafka/secrets
      - kafka_config:/mnt/shared/config
    networks:
      - shop_default
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1g

  # ==================== RabbitMQ 消息队列 ====================
  rabbitmq:
    image: rabbitmq:3-management
    container_name: shop-prod-rabbitmq
    ports:
      - '25672:5672'
      - '25673:15672'
    environment:
      RABBITMQ_DEFAULT_USER: shop
      RABBITMQ_DEFAULT_PASS: shop123
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - shop_default
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3

  # ==================== Elasticsearch ====================
  elasticsearch:
    image: elasticsearch:9.3.3
    container_name: shop-prod-elasticsearch
    environment:
      - discovery.type=single-node
      - 'ES_JAVA_OPTS=-Xms512m -Xmx512m'
      - xpack.security.enabled=false
      - TZ=Asia/Shanghai
    ports:
      - '29200:9200'
      - '29300:9300'
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - shop_default
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1g

  # ==================== Logstash ====================
  logstash:
    image: logstash:9.3.3
    container_name: shop-prod-logstash
    ports:
      - '25044:5044'
      - '29600:9600'
    volumes:
      - ./docker/config/logstash/pipeline:/usr/share/logstash/pipeline
    networks:
      - shop_default
    restart: unless-stopped
    depends_on:
      - elasticsearch
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9600/_node/stats || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 1g

  # ==================== Kibana ====================
  kibana:
    image: kibana:9.3.3
    container_name: shop-prod-kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - TZ=Asia/Shanghai
    ports:
      - '25601:5601'
    networks:
      - shop_default
    restart: unless-stopped
    depends_on:
      - elasticsearch
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5601/api/status || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3

  # ==================== shop-admin-api ====================
  shop-admin-api:
    image: shop-admin-api:1.0.0
    build:
      context: ./backend
      dockerfile: ./shop-admin-api/Dockerfile
    container_name: shop-prod-admin-api
    ports:
      - '28081:8080'
    environment:
      JAVA_OPTS: -Xms1g -Xmx2g -XX:+UseG1GC -XX:MaxGCPauseMillis=200
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/shop?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root123
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_LIQUIBASE_DROP_FIRST: false
      TZ: Asia/Shanghai
      JWT_SECRET: CHANGE_THIS_JWT_SECRET_KEY_AT_LEAST_32_CHARS
      JWT_EXPIRATION: 604800000
    networks:
      - shop_default
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 2g

  # ==================== shop-app-api ====================
  shop-app-api:
    image: shop-app-api:1.0.0
    build:
      context: ./backend
      dockerfile: ./shop-app-api/Dockerfile
    container_name: shop-prod-app-api
    ports:
      - '28080:8080'
    environment:
      JAVA_OPTS: -Xms1g -Xmx2g -XX:+UseG1GC -XX:MaxGCPauseMillis=200
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/shop?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root123
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      TZ: Asia/Shanghai
      JWT_SECRET: CHANGE_THIS_JWT_SECRET_KEY_AT_LEAST_32_CHARS
      JWT_EXPIRATION: 604800000
    networks:
      - shop_default
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 2g

  # ==================== shop-admin-ui ====================
  shop-admin-ui:
    image: shop-admin-ui:1.0.0
    build:
      context: ./frontend/shop-admin-ui
      dockerfile: Dockerfile
    container_name: shop-prod-admin-ui
    ports:
      - '28001:80'
    networks:
      - shop_default
    restart: unless-stopped

# ==================== 网络配置 ====================
networks:
  shop_default:
    driver: bridge

# ==================== 数据卷配置 ====================
volumes:
  mysql_data:
  redis_data:
  kafka_data:
  kafka_secrets:
  kafka_config:
  rabbitmq_data:
  elasticsearch_data:
