
name: 功能请求
description: 提出一个新功能需求
labels: ["类型: 新功能"]
body:
  - type: markdown
    attributes:
      value: |
        ## 功能请求
        请详细描述你希望添加的功能。

  - type: textarea
    id: problem
    attributes:
      label: 问题描述
      description: 描述当前遇到的问题或需求
      placeholder: 例如：商品列表页面缺少批量操作功能，无法同时删除多个商品
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 期望的解决方案
      description: 描述你期望的功能实现方式
      placeholder: 例如：在商品列表页面添加复选框，支持全选和批量删除操作
    validations:
      required: true

  - type: dropdown
    id: module
    attributes:
      label: 目标模块
      options:
        - backend/shop-admin
        - backend/shop-api
        - frontend/admin-ui
        - frontend/mini-app
        - docker
        - other
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: 优先级
      options:
        - 低
        - 中
        - 高
        - 紧急
      default: 1
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案
      description: 描述你考虑过的其他替代方案
      placeholder: 例如：也可以通过筛选后全选删除来间接实现

  - type: textarea
    id: additional
    attributes:
      label: 补充信息
      description: 其他有助于理解需求的信息、截图或参考链接
      placeholder: 可以粘贴参考截图或链接...
