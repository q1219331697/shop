
# ============================================================
# Dependabot 配置 - 自动依赖更新
# 文档: https://docs.github.com/en/code-security/dependabot
# ============================================================

version: 2

updates:
  # ---------- 后端 Maven 依赖 ----------
  - package-ecosystem: maven
    directory: /backend
    schedule:
      interval: daily
      time: "09:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    labels:
      - "类型: 重构"
      - "模块: admin"
    commit-message:
      prefix: chore(deps)
    reviewers:
      - shop-team

  # ---------- 前端 npm 依赖 ----------
  - package-ecosystem: npm
    directory: /frontend/shop-admin-ui
    schedule:
      interval: daily
      time: "09:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    labels:
      - "类型: 重构"
      - "模块: admin-ui"
    commit-message:
      prefix: chore(deps)
    reviewers:
      - shop-team

  # ---------- Docker 镜像版本 ----------
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: daily
      time: "09:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 3
    labels:
      - "模块: docker"
    commit-message:
      prefix: chore(docker)

  # ---------- GitHub Actions 版本 ----------
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
      time: "09:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 3
    labels:
      - "类型: 重构"
    commit-message:
      prefix: ci(deps)
