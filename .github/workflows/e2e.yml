# ============================================================
# E2E 工作流 - Playwright + Docker Compose
# 触发条件: Push / PR 到 master 分支（也支持手动触发）
# 执行内容:
#   1. 用仓库现成的 docker-compose.yml 起后端栈 (mysql + redis + kafka + shop-admin-api)
#      - 仅起 E2E 必需的 4 个服务；ES / logstash / kibana / rabbitmq / shop-app-api / shop-admin-ui 都不需要，省内存防 OOM
#      - 通过 ADMIN_JAVA_OPTS / KAFKA_HEAP_OPTS (docker-compose.yml 中的可覆盖默认值) 压低 JVM 堆，适配 7G runner
#   2. 等 admin-api 健康 (http://localhost:8081/actuator/health)
#   3. 起 Vite dev (Playwright webServer 自动完成) + 跑 E2E
#   4. 上传 HTML / JUnit 报告
# 说明: 不修改 playwright.config.ts (项目禁止 AI 改)；reporter / workers / retries 通过 CLI 传入
# ============================================================

name: E2E

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write
  pages: write
  id-token: write

jobs:
  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    environment: github-pages
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Show runner CPU and memory
        run: |
          echo "CPU cores: $(nproc)"
          lscpu | grep -E 'CPU\(s\)|Thread|Model name'
          echo "--- Memory ---"
          free -h

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 仅起 E2E 必需的后端栈；CI 下压低 JVM 堆以适配 7G runner
      - name: Start backend stack
        env:
          ADMIN_JAVA_OPTS: "-Xms256m -Xmx512m -XX:+UseG1GC"
          KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"
        run: docker compose up -d --build mysql redis kafka shop-admin-api

      - name: Wait for admin-api health
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8081/actuator/health; then
              echo "admin-api is healthy"
              exit 0
            fi
            echo "waiting for admin-api... ($i)"
            sleep 5
          done
          echo "::error::admin-api did not become healthy in time"
          docker compose logs shop-admin-api || true
          exit 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/shop-admin-ui/package-lock.json

      - name: Install dependencies
        working-directory: frontend/shop-admin-ui
        run: npm ci

      - name: Install Playwright browser
        working-directory: frontend/shop-admin-ui
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        working-directory: frontend/shop-admin-ui
        env:
          PLAYWRIGHT_JUNIT_OUTPUT_NAME: test-results/results.xml
        run: npx playwright test --reporter=github,html,junit --workers=2 --retries=1

      - name: Tear down
        if: always()
        run: docker compose down -v || true

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/shop-admin-ui/playwright-report/
          retention-days: 7

      - name: Upload JUnit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-results
          path: frontend/shop-admin-ui/test-results/results.xml
          retention-days: 7

      # 把 HTML 报告发布到 GitHub Pages，在线点开即可查看（含截图/trace）
      - name: Upload Pages artifact
        if: always()
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/shop-admin-ui/playwright-report/

      - name: Deploy to GitHub Pages
        if: always()
        uses: actions/deploy-pages@v4
