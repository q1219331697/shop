
# ============================================================
# PR 检查工作流
# 触发条件: PR 到 main/develop 分支
# 执行内容: 代码风格检查 + 编译验证 + 类型检查
# ============================================================

name: PR Check

on:
  pull_request:
    branches: [main, develop]

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # ==================== 后端代码检查 ====================
  backend-check:
    name: Backend Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Cache Maven dependencies
        uses: actions/cache@v6
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ hashFiles('backend/**/pom.xml') }}
          restore-keys: |
            maven-${{ runner.os }}-

      - name: Compile
        working-directory: backend
        run: mvn clean compile -DskipTests -B

      - name: Checkstyle
        working-directory: backend
        run: mvn checkstyle:check -B
        continue-on-error: true

  # ==================== 前端代码检查 ====================
  frontend-check:
    name: Frontend Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/admin-ui/package-lock.json

      - name: Install dependencies
        working-directory: frontend/admin-ui
        run: npm ci

      - name: Type check
        working-directory: frontend/admin-ui
        run: npx vue-tsc --noEmit

      - name: Lint check
        working-directory: frontend/admin-ui
        run: npx eslint src/ --ext .ts,.vue --no-error-on-unmatched-pattern
        continue-on-error: true

  # ==================== PR 规范检查 ====================
  pr-lint:
    name: PR Title Lint
    runs-on: ubuntu-latest
    steps:
      - name: Check PR title
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            chore
            ci
          requireScope: false
          subjectPattern: ^[A-Z一-鿿].+$
          subjectPatternError: |
            PR 标题的描述部分必须以大写字母或中文开头
            示例: feat(admin-ui): 新增商品列表页面
