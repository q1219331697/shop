
# ============================================================
# PR 检查工作流
# 触发条件: PR 到 master 分支
# 执行内容: 代码风格检查 + 编译验证 + 类型检查
# ============================================================

name: PR Check

on:
  pull_request:
    branches: [master]

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # ==================== 后端代码检查 ====================
  backend-check:
    name: Backend Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ hashFiles('backend/**/pom.xml') }}
          restore-keys: |
            maven-${{ runner.os }}-

      - name: Compile
        working-directory: backend
        run: mvn clean compile -DskipTests -B

      - name: Checkstyle
        working-directory: backend
        run: mvn checkstyle:check -B
        continue-on-error: true

  # ==================== 前端代码检查 ====================
  frontend-check:
    name: Frontend Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/shop-admin-ui/package-lock.json

      - name: Install dependencies
        working-directory: frontend/shop-admin-ui
        run: npm ci

      # 先构建生成被 .gitignore 忽略的 src/auto-imports.d.ts / src/components.d.ts，
      # 否则 vue-tsc 找不到自动导入的全局标识符（如 api）
      - name: Build (生成自动导入声明)
        working-directory: frontend/shop-admin-ui
        run: npm run build

      - name: Type check
        working-directory: frontend/shop-admin-ui
        run: npx vue-tsc --noEmit

      - name: Lint check
        working-directory: frontend/shop-admin-ui
        run: npx eslint src/ --ext .ts,.vue --no-error-on-unmatched-pattern
        continue-on-error: true

  # ==================== PR 规范检查 ====================
  pr-lint:
    name: PR Title Lint
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - name: Check PR title
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            chore
            ci
          requireScope: false
