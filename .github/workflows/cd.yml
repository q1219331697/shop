
# ============================================================
# CD 工作流 - 持续部署
# 触发条件: 推送 tag (v*) 到仓库
# 执行内容: 构建Docker镜像 → 推送到Docker Hub → 部署到服务器
# ============================================================

name: CD

on:
  push:
    tags:
      - 'v*'

env:
  REGISTRY: docker.io
  IMAGE_PREFIX: ${{ secrets.DOCKER_USERNAME }}/shop

jobs:
  # ==================== 构建并推送 Docker 镜像 ====================
  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Extract version from tag
        id: meta
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # ---------- shop-admin 镜像 ----------
      - name: Build & Push shop-admin
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile.admin
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-admin:latest
            ${{ env.IMAGE_PREFIX }}-admin:${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ---------- shop-api 镜像 ----------
      - name: Build & Push shop-api
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile.api
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-api:latest
            ${{ env.IMAGE_PREFIX }}-api:${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ==================== 部署到服务器 ====================
  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd ${{ secrets.DEPLOY_PATH }}

            # 设置环境变量
            export APP_VERSION=${{ needs.build-and-push.outputs.version }}
            export DOCKER_USERNAME=${{ secrets.DOCKER_USERNAME }}
            export APP_NAME=shop
            export MYSQL_USERNAME=${{ secrets.MYSQL_USERNAME }}
            export MYSQL_PASSWORD=${{ secrets.MYSQL_PASSWORD }}
            export REDIS_PASSWORD=${{ secrets.REDIS_PASSWORD }}

            # 登录 Docker Hub
            echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

            # 拉取最新镜像
            docker compose -f docker/docker-compose.app.yml pull

            # 重启服务（零停机）
            docker compose -f docker/docker-compose.app.yml up -d --remove-orphans

            # 清理旧镜像
            docker image prune -f

            # 健康检查
            echo "等待服务启动..."
            sleep 30
            curl -sf http://localhost:8081/actuator/health && echo " - shop-admin OK"
            curl -sf http://localhost:8080/actuator/health && echo " - shop-api OK"
