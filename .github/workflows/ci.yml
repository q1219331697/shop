
# ============================================================
# CI 工作流 - 持续集成
# 触发条件: Push 到 main/develop 分支，或 PR 到 main/develop 分支
# 执行内容: 后端编译检查 + 前端构建检查
# ============================================================

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==================== 后端 CI ====================
  backend:
    name: Backend CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ hashFiles('backend/**/pom.xml') }}
          restore-keys: |
            maven-${{ runner.os }}-

      - name: Compile & Verify
        working-directory: backend
        run: mvn clean verify -DskipTests -Dcheckstyle.skip=true -B

      - name: Run Tests
        working-directory: backend
        run: mvn test -B

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: backend/**/target/surefire-reports/
          retention-days: 7

  # ==================== 前端 CI ====================
  frontend:
    name: Frontend CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/admin-ui/package-lock.json

      - name: Install dependencies
        working-directory: frontend/admin-ui
        run: npm ci

      - name: Type check
        working-directory: frontend/admin-ui
        run: npx vue-tsc --noEmit

      - name: Build
        working-directory: frontend/admin-ui
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: admin-ui-dist
          path: frontend/admin-ui/dist/
          retention-days: 3
