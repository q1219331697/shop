# ============================================================
# Docker Compose - Shop 应用统一配置
# 包含：基础设施 + 应用服务
#
# 使用方法：只有开发环境 --build 选项，测试和生产环境不需要
#   开发环境:   docker compose --env-file .env.dev up -d --build
#   测试环境:   docker compose --env-file .env.test up -d
#   生产环境:   docker compose --env-file .env.prod up -d
#
# 或使用项目前缀：只有开发环境 --build 选项，测试和生产环境不需要
#   开发环境:   docker compose --env-file .env.dev -p shop-dev up -d --build
#   测试环境:   docker compose --env-file .env.test -p shop-test up -d
#   生产环境:   docker compose --env-file .env.prod -p shop-prod up -d
# ============================================================

services:
  # ==================== MySQL 数据库 ====================
  mysql:
    image: mysql:9.7
    container_name: ${COMPOSE_PROJECT_NAME}-mysql
    ports:
      - '${MYSQL_PORT:-3306}:3306'
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123}
      MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
      MYSQL_DATABASE: shop
      TZ: Asia/Shanghai
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_0900_ai_ci
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - shop
    restart: unless-stopped

  # ==================== Redis 缓存 ====================
  redis:
    image: redis:8-alpine
    container_name: ${COMPOSE_PROJECT_NAME}-redis
    ports:
      - '${REDIS_PORT:-6379}:6379'
    command: redis-server --appendonly yes ${REDIS_PASSWORD:+--requirepass ${REDIS_PASSWORD}}
    volumes:
      - redis_data:/data
    networks:
      - shop
    restart: unless-stopped

  # ==================== Kafka 消息队列 ====================
  kafka:
    image: apache/kafka:latest
    container_name: ${COMPOSE_PROJECT_NAME}-kafka
    ports:
      - '${KAFKA_PORT:-9092}:9092'
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: controller,broker
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_NUM_PARTITIONS: 3
    volumes:
      - kafka_data:/var/lib/kafka/data
      - kafka_secrets:/etc/kafka/secrets
      - kafka_config:/mnt/shared/config
    networks:
      - shop
    restart: unless-stopped

  # ==================== RabbitMQ 消息队列 ====================
  rabbitmq:
    image: rabbitmq:3-management
    container_name: ${COMPOSE_PROJECT_NAME}-rabbitmq
    ports:
      - '${RABBITMQ_PORT:-5672}:5672'
      - '${RABBITMQ_MGMT_PORT:-5673}:15672'
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-shop}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-shop123}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - shop
    restart: unless-stopped

  # ==================== Elasticsearch ====================
  elasticsearch:
    image: elasticsearch:9.3.3
    container_name: ${COMPOSE_PROJECT_NAME}-elasticsearch
    environment:
      - discovery.type=single-node
      - 'ES_JAVA_OPTS=-Xms512m -Xmx512m'
      - xpack.security.enabled=false
      - TZ=Asia/Shanghai
    ports:
      - '${ES_PORT:-9200}:9200'
      - '${ES_COORD_PORT:-9300}:9300'
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - shop
    restart: unless-stopped
    mem_limit: 1g

  # ==================== Logstash ====================
  logstash:
    image: logstash:9.3.3
    container_name: ${COMPOSE_PROJECT_NAME}-logstash
    ports:
      - '${LOGSTASH_PORT:-5044}:5044'
      - '${LOGSTASH_REPORTING_PORT:-9600}:9600'
    volumes:
      - ./docker/config/logstash/pipeline:/usr/share/logstash/pipeline
    networks:
      - shop
    restart: unless-stopped
    depends_on:
      - elasticsearch
    mem_limit: 1g

  # ==================== Kibana ====================
  kibana:
    image: kibana:9.3.3
    container_name: ${COMPOSE_PROJECT_NAME}-kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - TZ=Asia/Shanghai
    ports:
      - '${KIBANA_EXT_PORT:-5601}:5601'
    networks:
      - shop
    restart: unless-stopped
    depends_on:
      - elasticsearch

  # ==================== shop-admin-api ====================
  shop-admin-api:
    image: shop-admin-api:${APP_VERSION:-1.0.0}
    build:
      context: ./backend
      dockerfile: ./shop-admin-api/Dockerfile
    container_name: ${COMPOSE_PROJECT_NAME}-admin-api
    ports:
      - '${ADMIN_PORT:-8081}:8080'
    environment:
      JAVA_OPTS: ${ADMIN_JAVA_OPTS:--Xms256m -Xmx512m -XX:+UseG1GC}
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/shop?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USERNAME:-root}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-root123}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      TZ: Asia/Shanghai
      JWT_SECRET: ${JWT_SECRET:-shop-secret-key-for-jwt-token-generation}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-604800000}
    networks:
      - shop
    restart: unless-stopped
    depends_on:
      - mysql
      - redis

  # ==================== shop-app-api ====================
  shop-app-api:
    image: shop-app-api:${APP_VERSION:-1.0.0}
    build:
      context: ./backend
      dockerfile: ./shop-app-api/Dockerfile
    container_name: ${COMPOSE_PROJECT_NAME}-app-api
    ports:
      - '${API_PORT:-8080}:8080'
    environment:
      JAVA_OPTS: ${API_JAVA_OPTS:--Xms256m -Xmx512m -XX:+UseG1GC}
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/shop?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USERNAME:-root}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-root123}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      TZ: Asia/Shanghai
      JWT_SECRET: ${JWT_SECRET:-shop-secret-key-for-jwt-token-generation}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-604800000}
    networks:
      - shop
    restart: unless-stopped
    depends_on:
      - mysql
      - redis

  # ==================== shop-admin-ui ====================
  shop-admin-ui:
    image: shop-admin-ui:${APP_VERSION:-1.0.0}
    build:
      context: ./frontend/shop-admin-ui
      dockerfile: Dockerfile
    container_name: ${COMPOSE_PROJECT_NAME}-admin-ui
    ports:
      - '${ADMIN_UI_PORT:-8000}:80'
    networks:
      - shop
    restart: unless-stopped

# ==================== 网络配置 ====================
networks:
  shop:
    driver: bridge

# ==================== 数据卷配置 ====================
# 命名卷会自动加上 COMPOSE_PROJECT_NAME 前缀，
# 因此 dev/test/prod 环境的数据卷相互隔离，不会冲突。
volumes:
  mysql_data:
  redis_data:
  kafka_data:
  kafka_secrets:
  kafka_config:
  rabbitmq_data:
  elasticsearch_data:
