# ============================================================
# Docker Compose - Shop 应用
# 包含：基础设施 + 应用服务
#
# 使用方法：
#   docker compose up -d --build
# ============================================================

services:
  # ==================== MySQL 数据库 ====================
  mysql:
    image: mysql:9
    container_name: shop-mysql
    ports:
      - '3306:3306'
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
      MYSQL_DATABASE: shop
      TZ: Asia/Shanghai
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_0900_ai_ci
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - shop_default
    restart: unless-stopped

  # ==================== Redis 缓存 ====================
  redis:
    image: redis:8-alpine
    container_name: shop-redis
    ports:
      - '6379:6379'
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - shop_default
    restart: unless-stopped

  # ==================== Kafka 消息队列 ====================
  kafka:
    image: apache/kafka:latest
    container_name: shop-kafka
    ports:
      - '9094:9094'
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'controller,broker'
      KAFKA_LISTENERS: 'PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:9094'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9094'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:9093'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    volumes:
      - kafka_data:/var/lib/kafka/data
      - kafka_secrets:/etc/kafka/secrets
      - kafka_config:/mnt/shared/config
    networks:
      - shop_default
    restart: unless-stopped

  # ==================== RabbitMQ 消息队列 ====================
  rabbitmq:
    image: rabbitmq:3-management
    container_name: shop-rabbitmq
    ports:
      - '5672:5672'
      - '5673:15672'
    environment:
      RABBITMQ_DEFAULT_USER: shop
      RABBITMQ_DEFAULT_PASS: shop123
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - shop_default
    restart: unless-stopped

  # ==================== Elasticsearch ====================
  elasticsearch:
    image: elasticsearch:9.3.3
    container_name: shop-elasticsearch
    environment:
      - discovery.type=single-node
      - 'ES_JAVA_OPTS=-Xms512m -Xmx512m'
      - xpack.security.enabled=false
      - TZ=Asia/Shanghai
    ports:
      - '9200:9200'
      - '9300:9300'
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - shop_default
    restart: unless-stopped
    mem_limit: 1g

  # ==================== Logstash ====================
  logstash:
    image: logstash:9.3.3
    container_name: shop-logstash
    ports:
      - '5044:5044'
      - '9600:9600'
    volumes:
      - ./docker/config/logstash/pipeline:/usr/share/logstash/pipeline
    networks:
      - shop_default
    restart: unless-stopped
    depends_on:
      - elasticsearch
    mem_limit: 1g

  # ==================== Kibana ====================
  kibana:
    image: kibana:9.3.3
    container_name: shop-kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - TZ=Asia/Shanghai
    ports:
      - '5601:5601'
    networks:
      - shop_default
    restart: unless-stopped
    depends_on:
      - elasticsearch

  # ==================== shop-admin-api ====================
  shop-admin-api:
    image: shop-admin-api:1.0.0
    build:
      context: ./backend
      dockerfile: ./shop-admin-api/Dockerfile
    container_name: shop-admin-api
    ports:
      - '8081:8080'
    environment:
      JAVA_OPTS: -Xms512m -Xmx1g -XX:+UseG1GC
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/shop?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root123
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_LIQUIBASE_DROP_FIRST: true
      SPRING_PROFILES_ACTIVE: dev
      TZ: Asia/Shanghai
      JWT_SECRET: shop-secret-key
      JWT_EXPIRATION: 604800000
    networks:
      - shop_default
    restart: unless-stopped
    depends_on:
      - mysql
      - redis

  # ==================== shop-app-api ====================
  shop-app-api:
    image: shop-app-api:1.0.0
    build:
      context: ./backend
      dockerfile: ./shop-app-api/Dockerfile
    container_name: shop-app-api
    ports:
      - '8080:8080'
    environment:
      JAVA_OPTS: -Xms512m -Xmx1g -XX:+UseG1GC
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/shop?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root123
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      TZ: Asia/Shanghai
      JWT_SECRET: shop-secret-key
      JWT_EXPIRATION: 604800000
    networks:
      - shop_default
    restart: unless-stopped
    depends_on:
      - mysql
      - redis

  # ==================== shop-admin-ui ====================
  shop-admin-ui:
    image: shop-admin-ui:1.0.0
    build:
      context: ./frontend/shop-admin-ui
      dockerfile: Dockerfile
    container_name: shop-admin-ui
    ports:
      - '8001:80'
    networks:
      - shop_default
    restart: unless-stopped

# ==================== 网络配置 ====================
networks:
  shop_default:
    driver: bridge

# ==================== 数据卷配置 ====================
volumes:
  mysql_data:
  redis_data:
  kafka_data:
  kafka_secrets:
  kafka_config:
  rabbitmq_data:
  elasticsearch_data:
